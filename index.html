<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#f3f4f6; --surface2:#e9ebee; --line:#e2e4e8;
  --text:#1b1e23; --muted:#626a74; --white:#ffffff;
  --forest:#2b6a4e; --park:#b9471c; --tirol:#2f5f8f; --road:#4d5a68;
  --accent:var(--road); --accent-soft:#e8ecf0;
  --radius:14px; --shadow:0 1px 2px rgba(20,24,30,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1b1e23; --surface2:#242830; --line:#2c313a;
    --text:#eceff3; --muted:#9aa3ad; --white:#1b1e23;
    --forest:#5fb08a; --park:#e8825a; --tirol:#6ea3d8; --road:#94a3b5;
    --accent-soft:#242830;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e23; --surface2:#242830; --line:#2c313a;
  --text:#eceff3; --muted:#9aa3ad; --white:#1b1e23;
  --forest:#5fb08a; --park:#e8825a; --tirol:#6ea3d8; --road:#94a3b5;
  --accent-soft:#242830;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Heebo","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit}
.en,.time{direction:ltr;unicode-bidi:isolate;font-style:normal}
.en{display:inline-block}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 40px}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);border-bottom:1px solid var(--line);
}
.top .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 6px}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;scroll-snap-align:center;min-width:56px;min-height:56px;
  border:1.5px solid var(--line);background:var(--surface);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 10px;line-height:1.15;cursor:pointer;
}
.tab b{font-size:17px;font-weight:800}
.tab span{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] span{color:rgba(255,255,255,.85)}
.tab:focus-visible{outline:3px solid var(--tirol);outline-offset:2px}
.tab.today::after{content:"היום";font-size:10px;font-weight:700;color:var(--park);margin-top:2px}
.tab[aria-selected="true"].today::after{color:#fff}

/* ---------- day header ---------- */
.dayhead{padding:22px 0 8px;border-bottom:4px solid var(--accent)}
.dayhead .date{display:flex;align-items:baseline;gap:10px}
.dayhead .num{font-size:56px;font-weight:800;line-height:1;color:var(--accent);letter-spacing:-.03em}
.dayhead .wd{font-size:20px;font-weight:700}
.dayhead .wd small{display:block;font-size:14px;color:var(--muted);font-weight:400}
.dayhead h2{margin:8px 0 4px;font-size:24px;font-weight:800;line-height:1.25}
.dayhead .lead{margin:0;color:var(--muted);font-size:16px}
.drive{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500
}
.chip svg{width:16px;height:16px;flex:none}
.chip.total{background:var(--accent);color:#fff}

/* ---------- sections ---------- */
.sec{margin-top:26px}
.sec h3{margin:0 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec h3 svg{width:20px;height:20px;color:var(--accent)}
.note{
  background:var(--surface);border-radius:var(--radius);padding:14px 16px;
  font-size:16px;margin-bottom:10px
}
.note.warn{border-right:4px solid var(--park)}
.note b{font-weight:700}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.item{
  display:grid;grid-template-columns:44px 1fr;gap:0 10px;
  padding:14px 0;border-bottom:1px solid var(--line);position:relative
}
.item:last-child{border-bottom:none}
.check{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--bg);
  display:flex;align-items:center;justify-content:center;margin-top:2px;cursor:pointer;padding:0
}
.check svg{width:18px;height:18px;opacity:0;transition:opacity .15s}
.item.done .check{background:var(--accent);border-color:var(--accent)}
.item.done .check svg{opacity:1;color:#fff}
.item.done .ttl,.item.done .desc{opacity:.5}
.item.done .ttl{text-decoration:line-through;text-decoration-thickness:1.5px}
.time{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:2px;display:inline-block}
.time.free{direction:rtl;color:var(--muted);font-weight:500}
.ttl{margin:0;font-size:18px;font-weight:700;line-height:1.35}
.desc{margin:4px 0 0;color:var(--muted);font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.act{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;
  border-radius:10px;border:1.5px solid var(--line);background:var(--bg);
  font-size:15px;font-weight:600;text-decoration:none;cursor:pointer
}
.act svg{width:17px;height:17px;flex:none}
.act.nav{background:var(--accent);border-color:var(--accent);color:#fff}
.act:focus-visible{outline:3px solid var(--tirol);outline-offset:2px}

/* ---------- must see ---------- */
.must{display:grid;gap:10px}
.mcard{
  border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--bg)
}
.mcard h4{margin:0 0 4px;font-size:17px;font-weight:800}
.mcard p{margin:0;color:var(--muted);font-size:15.5px}
.mcard .acts{margin-top:10px}
.tag{
  display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent);margin-inline-start:6px;vertical-align:middle
}

/* ---------- home ---------- */
.hero{padding:26px 0 10px}
.hero .kicker{color:var(--muted);font-size:15px;margin:0}
.hero h2{margin:4px 0 6px;font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.hero p{margin:0;font-size:17px}
.count{
  margin-top:18px;display:inline-flex;align-items:baseline;gap:8px;
  background:var(--surface);border-radius:12px;padding:10px 16px
}
.count b{font-size:28px;font-weight:800;color:var(--park)}
.route{list-style:none;margin:0;padding:0;border-right:3px solid var(--line);margin-right:8px}
.route li{position:relative;padding:0 22px 18px 0}
.route li::before{
  content:"";position:absolute;right:-9px;top:6px;width:15px;height:15px;border-radius:50%;
  background:var(--bg);border:3px solid var(--c,var(--road))
}
.route li:last-child{padding-bottom:0}
.route b{font-size:17px;display:block}
.route span{color:var(--muted);font-size:15px}
.hotel{
  border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  border-right-width:5px
}
.hotel h4{margin:0;font-size:19px;font-weight:800}
.hotel .sub{color:var(--muted);font-size:15px;margin:2px 0 0}
.hotel input{
  width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
  font:inherit;font-size:16px;background:var(--bg);color:var(--text)
}
.hotel input:focus-visible{outline:3px solid var(--tirol);outline-offset:1px}
.list{margin:0;padding:0 20px 0 0;font-size:16px}
.list li{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.big{
  display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--radius);
  border:1.5px solid var(--line);text-decoration:none;min-height:70px;justify-content:center
}
.big b{font-size:17px}
.big span{color:var(--muted);font-size:14px}
.big.call{border-color:var(--park);background:var(--accent-soft)}
.big.call b{color:var(--park);font-size:22px}

/* ---------- nav sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet .box{
  position:relative;width:100%;max-width:560px;background:var(--bg);
  border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 30px rgba(0,0,0,.2)
}
.sheet h4{margin:0 0 2px;font-size:18px;font-weight:800}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:15px}
.sheet .opt{
  display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:8px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  text-decoration:none;font-size:17px;font-weight:700;min-height:56px
}
.sheet .opt small{color:var(--muted);font-weight:400;font-size:14px;margin-inline-start:auto}
.sheet .close{
  width:100%;min-height:48px;border:none;background:none;color:var(--muted);font-size:16px;margin-top:4px;cursor:pointer
}
.wx{border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.wx h4{margin:0;font-size:17px;font-weight:800}
.wx .alt{color:var(--muted);font-size:14px}
.wx .temp{text-align:left;direction:ltr;font-weight:800;font-size:20px;line-height:1.1;color:var(--accent);white-space:nowrap}
.wx .temp small{display:block;font-size:12px;font-weight:500;color:var(--muted);direction:rtl;text-align:right}
.wx p{grid-column:1/-1;margin:2px 0 0;color:var(--muted);font-size:15px}
.wx .acts{grid-column:1/-1;margin-top:6px}
.pack{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px;margin:0;padding:0}
.pack dt{font-weight:800;color:var(--accent);direction:ltr;text-align:right;min-width:36px}
.pack dd{margin:0}
.foot{margin-top:40px;color:var(--muted);font-size:13.5px;text-align:center;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<script>
/* ===================== helpers ===================== */
const I = {
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',

  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>'

const en = s => `<span class="en">${s}</span>`;
const enc = s => encodeURIComponent(s);
const nav  = (q, label='ניווט') => `<button class="act nav" data-nav="${q.replace(/"/g,'&quot;')}">${I.pin}${label}</button>`;
const site = (u, label='אתר רשמי') => `<a class="act" href="${u}" target="_blank" rel="noopener">${I.web}${label}</a>`;
const yt   = (q, label='סרטון') => `<a class="act" href="https://www.youtube.com/results?search_query=${enc(q)}" target="_blank" rel="noopener">${I.play}${label}</a>`;

/* ===================== data ===================== */
const HOTELS = {
  titisee:{ name:'Maritim Titisee Hotel', where:'טיטיזי, היער השחור', nights:'לילות 1–2 · 27–28.9', color:'var(--forest)', q:'Maritim Hotel Titisee', url:'https://www.maritim.de' },
  rust:{ name:'המלון שנבחר באזור Rust', where:'רוסט / אירופה־פארק', nights:'לילות 3–5 · 29.9–1.10', color:'var(--park)', q:'Rust, Germany', url:null, editable:true },
  tirol:{ name:'Interalpen-Hotel Tyrol', where:'זיפלד / טירול', nights:'לילות 6–7 · 2–3.10', color:'var(--tirol)', q:'Interalpen-Hotel Tyrol, Telfs', url:'https://www.interalpen.com' }
};

const DAYS = [
{ n:1, d:'27.9', wd:'ראשון', region:'road', title:'טיסה למינכן, לנדסברג וטיטיזי', lead:'יום נחיתה ונסיעה. הרבה זמן ברכב, אבל עם עצירה יפה באמצע.',

const REGION_COLOR = { road:'var(--road)', forest:'var(--forest)', park:'var(--park)', tirol:'var(--tirol)' };
const HEB_DAY = { 'ראשון':'א׳','שני':'ב׳','שלישי':'ג׳','רביעי':'ד׳','חמישי':'ה׳','שישי':'ו׳','שבת':'ש׳' };
const TRIP_START = new Date(2026,8,27);

/* ===================== state ===================== */
let done = {};
try{ done = JSON.parse(localStorage.getItem('trip.done')||'{}'); }catch(e){ done = {}; }
function saveDone(){ try{ localStorage.setItem('trip.done', JSON.stringify(done)); }catch(e){} }
function rustName(){ try{ return localStorage.getItem('trip.rustHotel')||''; }catch(e){ return ''; } }

function todayIndex(){
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((now - TRIP_START)/86400000);
  return (diff>=0 && diff<8) ? diff+1 : null;
}

/* ===================== render ===================== */
const tabsEl = document.getElementById('tabs');
const viewEl = document.getElementById('view');
let current = 'home';

function renderTabs(){
  const ti = todayIndex();
  let html = `<button class="tab" role="tab" data-id="home"><b>בית</b><span>מסלול</span></button>`;
  DAYS.forEach(d => {
    html += `<button class="tab${ti===d.n?' today':''}" role="tab" data-id="${d.n}" style="--accent:${REGION_COLOR[d.region]}"><b>${d.n}</b><span class="en">${d.d}</span></button>`;
  });
  html += `<button class="tab" role="tab" data-id="hotels"><b>לינה</b><span>מלונות</span></button>`;
  html += `<button class="tab" role="tab" data-id="info"><b>מידע</b><span>וטיפים</span></button>`;
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => show(b.dataset.id)));
}

function show(id){
  current = id;
  tabsEl.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.id===String(id)));
  const active = tabsEl.querySelector(`[data-id="${id}"]`);
  if(active) active.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  const day = DAYS.find(d => String(d.n)===String(id));
  viewEl.innerHTML = day ? renderDay(day) : id==='hotels' ? renderHotels() : id==='info' ? renderInfo() : renderHome();
  viewEl.style.setProperty('--accent', day ? REGION_COLOR[day.region] : 'var(--road)');
  window.scrollTo({top:0});
  bind();
  try{ location.hash = id; }catch(e){}
}

function renderHome(){
  const ti = todayIndex();
  const now = new Date(); now.setHours(0,0,0,0);
  const daysLeft = Math.round((TRIP_START - now)/86400000);
  let count = '';
  if(daysLeft>0) count = `<div class="count"><b>${daysLeft}</b> ימים לטיסה</div>`;
  else if(ti) count = `<div class="count">היום זה <b>יום ${ti}</b> של הטיול</div>`;
  else if(daysLeft<=-8) count = `<div class="count">הטיול הסתיים – <b>ברוכים השבים</b></div>`;

  const route = DAYS.map(d => `<li style="--c:${REGION_COLOR[d.region]}" data-go="${d.n}" role="button" tabindex="0"><b>יום ${d.n} · ${d.wd} ${en(d.d)}</b><span>${d.title}</span></li>`).join('');
  return `
  <section class="hero">
    <p class="kicker">משפחות אברהם וכץ · גרמניה ואוסטריה</p>
    <h2>טיול משפחתי</h2>
    <p>ראשון ${en('27.9')} עד ראשון ${en('4.10.2026')}. נחיתה בישראל בלילה שבין ראשון לשני, ${en('5.10')} בשעה ${en('00:45')}.</p>
    ${count}
  </section>
  <section class="sec"><h3>${I.list} המסלול יום אחרי יום</h3><ul class="route">${route}</ul></section>
  <section class="sec"><h3>${I.bed} איפה ישנים</h3>
    ${Object.values(HOTELS).map(h => `<div class="hotel" style="border-right-color:${h.color}"><h4>${en(h.editable ? (rustName()||h.name) : h.name)}</h4><p class="sub">${h.where} · ${h.nights}</p></div>`).join('')}
  </section>
  <section class="sec"><h3>${I.bulb} איך זה עובד</h3>
    <div class="note">בוחרים יום בסרגל למעלה. ליד כל פעילות יש כפתור <b>ניווט</b> שפותח את <span class="en">Waze</span> או את המפות ישירות ליעד, וכפתורי <b>אתר</b> ו־<b>סרטון</b> לפרטים. מסמנים ✓ על מה שכבר עשיתם – הסימון נשמר בטלפון שלכם.</div>
    <div class="note warn">זמני הנהיגה הם אומדנים בלי פקקים, חניה ועצירות. ביום אמת מנווטים לפי מצב התנועה, ואת שעות הפתיחה והכרטיסים מאמתים סמוך לנסיעה.</div>
  </section>`;
}

function renderDay(d){
  const hotel = d.hotel ? HOTELS[d.hotel] : null;
  const items = d.items.map((it,i) => {
    const key = `${d.n}.${i}`;
    return `<li class="item${done[key]?' done':''}" data-key="${key}">
      <button class="check" aria-label="סימון כבוצע" aria-pressed="${!!done[key]}">${I.check}</button>
      <div>
        <span class="time${it.free?' free':''}">${it.t}</span>
        <h4 class="ttl">${it.h}</h4>
        ${it.p ? `<p class="desc">${it.p}</p>` : ''}
        ${it.a && it.a.length ? `<div class="acts">${it.a.join('')}</div>` : ''}
      </div></li>`;
  }).join('');
  const drive = d.drive.map(x => `<span class="chip">${I.car}${x[0]} · ${en(x[1])}</span>`).join('') + `<span class="chip total">${I.clock}${d.total}</span>`;
  const must = d.must.map(m => `<div class="mcard"><h4>${m.h}${m.tag?`<span class="tag">${m.tag}</span>`:''}</h4><p>${m.p}</p>${m.a?`<div class="acts">${m.a.join('')}</div>`:''}</div>`).join('');
  const tips = d.tips.map(t => `<li>${t}</li>`).join('');
  return `
  <header class="dayhead">
    <div class="date"><span class="num en">${d.n}</span><span class="wd">יום ${d.wd}<small>${en(d.d+'.2026')}</small></span></div>
    <h2>${d.title}</h2>
    <p class="lead">${d.lead}</p>
    <div class="drive">${drive}</div>
  </header>
  <section class="sec"><h3>${I.clock} סדר היום</h3><ul class="tl">${items}</ul></section>
  ${hotel ? `<section class="sec"><h3>${I.bed} לינה הלילה</h3>
    <div class="hotel" style="border-right-color:${hotel.color}"><h4>${en(hotel.editable ? (rustName()||hotel.name) : hotel.name)}</h4><p class="sub">${hotel.where}</p>
    <div class="acts">${nav(hotel.editable ? (rustName()||hotel.q) : hotel.q,'ניווט למלון')}${hotel.url?site(hotel.url,'אתר המלון'):''}</div></div></section>` : ''}
  <section class="sec"><h3>${I.star} שווה לראות</h3><div class="must">${must}</div></section>
  <section class="sec"><h3>${I.bulb} טיפים ליום הזה</h3><ul class="list">${tips}</ul></section>`;
}

/www.google.com/search?q=מזג+אוויר+München" target="_blank" rel="noopener">${I.web}תחזית עדכנית</a></div></div>

/* ===================== interactions ===================== */
const sheet = document.getElementById('sheet');
function openNav(q){
  document.getElementById('sheetSub').textContent = q;
  document.getElementById('optWaze').href   = `https://waze.com/ul?q=${enc(q)}&navigate=yes`;
  document.getElementById('optGoogle').href = `https://www.google.com/maps/dir/?api=1&destination=${enc(q)}`;
  document.getElementById('optApple').href  = `https://maps.apple.com/?daddr=${enc(q)}`;
  sheet.classList.add('open');
}
sheet.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => sheet.classList.remove('open')));
document.addEventListener('keydown', e => { if(e.key==='Escape') sheet.classList.remove('open'); });

function bind(){
  viewEl.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => openNav(b.dataset.nav)));
  viewEl.querySelectorAll('.item .check').forEach(b => b.addEventListener('click', () => {
    const li = b.closest('.item'); const k = li.dataset.key;
    done[k] = !done[k]; if(!done[k]) delete done[k];
    li.classList.toggle('done', !!done[k]); b.setAttribute('aria-pressed', !!done[k]); saveDone();
  }));
  viewEl.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', () => show(el.dataset.go));
    el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); show(el.dataset.go); } });
  });
  const ri = document.getElementById('rustInput');
  if(ri) ri.addEventListener('change', () => { try{ localStorage.setItem('trip.rustHotel', ri.value.trim()); }catch(e){} show('hotels'); });
}

renderTabs();
const start = (location.hash||'').replace('#','');
show(start && (start==='hotels'||start==='info'||DAYS.some(d=>String(d.n)===start)) ? start : (todayIndex()||'home'));
</script>
